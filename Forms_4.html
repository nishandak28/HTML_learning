    <title>Radio & CheckBox</title>
</head>
<body>
    <h1>RadioBox</h1>

    <label><input type="radio" name="op1">UPI</label><br>
    <label><input type="radio" name="op1">Cash</label><br>
    <label><input type="radio" name="op1">Credit card</label><br>

    <br>

    <h1>check Box</h1>
    <label><input type="checkbox">UPI</label><br>
    <label><input type="checkbox">Cash</label><br>
    <label><input type="checkbox">Credit card</label><br>
</body>
</html>
