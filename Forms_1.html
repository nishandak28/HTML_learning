<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    
    <h1>Captcha form</h1>
    <form>
        <label for="cap">Enter the captcha:</label>
        <input type="text" name="captcha" id="cap">

        <br>

        <input type="submit" name="captcha">
        <input type="reset" value="Cancel" >

        <!--This is the button actions is specified in java script-->
        <br>
        <button type="button">Verify</button>
    </form>
    
    
</body>
</html>
