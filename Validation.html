<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validating</title>
</head>
<body>
    
    <h2>Validating Elements</h2>
    <hr>

    <form>
        <label for="nm">Name:</label>
        <input type="text" id="nm" name="username" pattern="^[A-Z][a-z]{5,50}$" placeholder="Enter the name">
        <br>
        <br>

        <label for="mail">Email:</label>
        <input type="email" id="mail" name="email" placeholder="Enter Email Address" pattern="^[a-z0-9]{6,15}[@][a-z]{5}[.][a-z]{3}$">
        <br>
        <br>

        <label for="phn">Phone Number:</label>
        <input type="tel" id="phn" name="mobile" pattern="^[6-9]{1}[0-9]{9}$" placeholder="">
        <br>
        <br>

        <label for="pass">Password:</label>
        <input type="password" id="pass" name="password" pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*[\d])(?=.*[@#!%])[a-zA-Z\d#%!@]{8,15}$"> 

        <button type="submit">Submit</button>
    </form>
</body>
</html>
