<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY FIRST UI</title>
</head>
<body>
    
    <form>
        <h1>Student Registration Form</h1>

        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your name.." required>
            <br>
            <br>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="mail" required>
            <br>
            <br>

            <label for="pass">Password:</label>
            <input type="password" id="pass" placeholder="" required>
            <br>
            <br>

            <label for="phn">Phone:</label>
            <input type="tel" id="phn" placeholder="Enter 10 digit number">
            <br>
            <br>

            <label for="web">Website:</label>
            <input type="url" id="web" placeholder="https://example.com">
            <br>
            <br>
            
            <label for="course">Search Course:</label>
            <input type="text" id="course" placeholder="search">
            <br>
        </fieldset>

        <fieldset>
            <legend>Other Details</legend>

            <label for="age">Age:</label>
            <input type="number" id="age" min="5" max="60">
            <br>
            <br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob">
            <br>
            <br>

            <label for="time">Preferred Time:</label>
            <input type="time" id="time">
            <br>
            <br>

            <label for="dt">Meeting Date & Time:</label>
            <input type="datetime-local" id="dt">
            <br>
            <br>

            <label for="gnd">Gender:</label>
            <label><input type="radio" name="opt">Male</label>
            <label><input type="radio" name="opt">Female</label>
            <label><input type="radio" name="opt">Others</label>
            <br>
            <br>

            <label>Hobbies:</label>
            <label><input type="checkbox" name="opt">Reading</label>
            <label><input type="checkbox" name="opt">Sports</label>
            <label><input type="checkbox" name="opt">Travel</label>
            <br>
            <br>

            <label for="clr">Favorite Color:</label>
            <input type="color" id="clr" name="color">
            <br>
            <br>

            <label>Skill Level:</label>
            <input type="range" value="2">
            <br>

        </fieldset>

        <fieldset>
            <legend>Selection</legend>

            <label for="select">Course</label>
            <select id="select">
                <option>Html</option>
                <option>Jss</option>
                <option>React</option>
                <option>Java</option>
            </select>
            <br>
            <br>

            <label for="city">City</label>
            <input type="text">
            <br>
            <br>

            <label>Upload Photo:</label>
            <input type="file">
            <br>
            <br>
        </fieldset>

        <fieldset>
            <legend>Comments</legend>

            <textarea placeholder="comments" row="30" cols="100"></textarea>


        </fieldset>

    </form>

</body>
</html>
