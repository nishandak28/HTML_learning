<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>column_spanning</title>
</head>
<body>
    
    <table border="1" style="width: 40%;" style="height: 40%;">
        <tr >
            <td colspan = "4">Column spanned title</td>
        </tr>

        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td rowspan="3">4</td>
        </tr>

        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            
        </tr>

        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            
        </tr>

    </table>
</body>
</html>
